name: Verify ceremony
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  contribution:
    # Every contribution PR: exactly one new key that is valid and builds on the latest one.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - uses: actions/cache@v4
        with: { path: ptau, key: ppot-0080-15 }
      - name: Download phase 1
        run: |
          [ -f ptau/ppot_0080_15.ptau ] || { mkdir -p ptau && curl -fSL --retry 3 --connect-timeout 30 --max-time 900 -o ptau/ppot_0080_15.ptau https://pse-trusted-setup-ppot.s3.eu-central-1.amazonaws.com/pot28_0080/ppot_0080_15.ptau; }
      - run: node scripts/verify.mjs --pr origin/${{ github.base_ref }}

  full:
    # On main: the committed circuit matches its source, and every key in the chain verifies.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Install circom 2.1.9
        run: |
          curl -sSfL -o /usr/local/bin/circom https://github.com/iden3/circom/releases/download/v2.1.9/circom-linux-amd64
          chmod +x /usr/local/bin/circom
      - run: bash scripts/check-circuit.sh
      - uses: actions/cache@v4
        with: { path: ptau, key: ppot-0080-15 }
      - name: Download phase 1
        run: |
          [ -f ptau/ppot_0080_15.ptau ] || { mkdir -p ptau && curl -fSL --retry 3 --connect-timeout 30 --max-time 900 -o ptau/ppot_0080_15.ptau https://pse-trusted-setup-ppot.s3.eu-central-1.amazonaws.com/pot28_0080/ppot_0080_15.ptau; }
      - run: node scripts/verify.mjs --all
      - if: hashFiles('final/transaction2_final.zkey') != ''
        run: node scripts/verify-final.mjs
