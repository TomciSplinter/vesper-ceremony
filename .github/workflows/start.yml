name: Start ceremony
# Run once by the coordinator (Actions tab -> Start ceremony -> Run workflow). Builds
# contributions/0000.zkey from the circuit and the public Perpetual Powers of Tau phase-1 file, in public,
# so the log shows exactly how the starting key was made.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Download phase 1
        run: |
          mkdir -p ptau
          curl -fSL --retry 3 --connect-timeout 30 --max-time 900 -o ptau/ppot_0080_15.ptau \
            https://pse-trusted-setup-ppot.s3.eu-central-1.amazonaws.com/pot28_0080/ppot_0080_15.ptau
          ls -l ptau
          echo "::notice::downloaded $(stat -c %s ptau/ppot_0080_15.ptau) bytes, blake2b $(b2sum ptau/ppot_0080_15.ptau | cut -c1-32)"
      - run: node scripts/init.mjs
        timeout-minutes: 300
      - run: |
          git config user.name "vesper-ceremony-bot"
          git config user.email "actions@github.com"
          git add contributions/0000.zkey phase1/
          git commit -m "Start ceremony: verify + pin phase 1, build 0000.zkey"
          git push
